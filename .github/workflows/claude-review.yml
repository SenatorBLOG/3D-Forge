name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Skip drafts and the bot's own PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read CLAUDE.md first for project conventions.

            Focus on, in order of importance:
            1. Real bugs and logic errors
            2. Leaked secrets or unvalidated user input
            3. Three.js resource leaks (missing dispose/cleanup)
            4. Violations of the conventions in CLAUDE.md
            5. Scope creep relative to the PR description

            Use `gh pr diff` and `gh pr view` to inspect the PR, then post ONE review
            comment with `gh pr comment` summarizing findings ordered by severity with
            file:line references. If everything is fine, say so briefly — do not invent
            issues. Do not approve or request changes formally; the human teammate decides.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Glob,Grep"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
